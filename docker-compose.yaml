services:
  db-postgres:
    image: postgres:17
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./app/.env

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    working_dir: /app
    ports:
      - "8000:8000"
    command: gunicorn app.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - ./app/.env
    depends_on:
      - db-postgres

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

volumes:
  postgres_data:
